<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onda Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff6a2b' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display&family=Inter:wght@400;500;600;800&family=Montserrat:wght@400;500;600;800&family=Playfair+Display:wght@400;500;600;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main class="stage">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span>Onda Studio</div>
        <div class="track-meta" id="trackMeta">Nessun brano caricato</div>
      </header>

      <div class="viewport" id="viewport">
        <canvas id="preview"></canvas>
        <button class="drop-hint" id="dropHint" type="button">
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </span>
          <strong>Trascina qui un brano</strong>
          <span>oppure clicca per sceglierlo · MP3, WAV, M4A, FLAC, OGG</span>
        </button>
        <div class="busy" id="busy" hidden>
          <div class="busy-label" id="busyLabel">Analisi del brano…</div>
          <div class="bar"><div class="bar-fill" id="busyBar"></div></div>
        </div>
        <div class="sync-overlay" id="syncOverlay" hidden>
          <div class="sync-count" id="syncCount"></div>
          <div class="sync-prev" id="syncPrev"></div>
          <div class="sync-next" id="syncNext"></div>
          <div class="sync-keys">
            <kbd>Spazio</kbd> riga successiva <kbd>X</kbd> schermo vuoto <kbd>⌫</kbd> annulla <kbd>Esc</kbd> fine
          </div>
        </div>
      </div>

      <div class="transport">
        <button class="play" id="playBtn" type="button" aria-label="Riproduci" disabled>
          <svg class="i-play" viewBox="0 0 24 24" width="18" height="18"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
        </button>
        <span class="time" id="timeCur">0:00</span>
        <div class="seek-wrap"><div class="range-mark" id="rangeMark" hidden></div><input type="range" id="seek" min="0" max="1000" step="1" value="0" disabled aria-label="Posizione" /></div>
        <span class="time" id="timeDur">0:00</span>
      </div>
    </main>

    <aside class="panel">
      <section class="group track">
        <h2>Brano</h2>
        <button class="btn wide" id="chooseAudio" type="button">Scegli file audio…</button>
        <input type="file" id="audioInput" accept="audio/*,.m4a,.flac,.ogg,.opus,.wav,.mp3,.aac" hidden />
        <div class="stats" id="stats"></div>
      </section>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="panel-body" id="panelBody"></div>
      <input type="file" id="imageInput" accept="image/*" hidden />
    </aside>
  </div>

  <div class="drag-veil" id="dragVeil" hidden><div>Rilascia per caricare</div></div>

  <div class="modal" id="exportModal" hidden>
    <div class="modal-card">
      <h3 id="exportTitle">Esportazione in corso</h3>
      <canvas id="exportThumb" width="480" height="270"></canvas>
      <div class="bar"><div class="bar-fill" id="exportBar"></div></div>
      <div class="export-info"><span id="exportPct">0%</span><span id="exportEta"></span></div>
      <p class="note" id="exportMsg"></p>
      <div class="row end">
        <a class="btn primary" id="exportDownload" hidden>Scarica MP4</a>
        <button class="btn ghost" id="exportCancel" type="button">Annulla</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
